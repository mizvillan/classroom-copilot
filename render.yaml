# Classroom Copilot — one Node process serves the API and the built frontend Deploy as a Render Blueprint. services: - type: web name: classroom-copilot runtime: node plan: starter # free starts too, but the free plan restarts often and wipes the local data dir buildCommand: npm install && npm run build startCommand: npm start healthCheckPath: /api/env disk: name: classroom-data mountPath: /opt/classroom-copilot/data sizeGB: 1
